<!-- =================================================================== -->
<!-- VIEW 1: MAIN TOOLBOX HUB (MAIN PAGE / 首页) -->
<!-- =================================================================== -->
<div id="view-hub" class="app-view active">
  <!-- Raycast / Linear Style Hub Grid -->
  <section class="shortcuts-grid" id="tool-grid">

    <!-- Shortcut Card 0: Admin Console (Visible ONLY for Admin) -->
    <div id="hub-admin-card" class="shortcut-card shortcut-purple hidden" data-target-view="admin">
      <div class="shortcut-top">
        <div class="shortcut-icon-circle">
          <span class="shortcut-icon">👑</span>
        </div>
        <span class="shortcut-pill-badge">ADMIN</span>
      </div>
      <div class="shortcut-bottom">
        <h2 class="shortcut-title">Admin Console</h2>
        <span class="shortcut-subtitle">系统控制台与用户权限管理</span>
      </div>
    </div>

    <!-- Shortcut Card 1: Court Ledger (羽球 AA 算账器) -->
    <div class="shortcut-card shortcut-purple" data-target-view="courtledger">
      <div class="shortcut-top">
        <div class="shortcut-icon-circle">
          <span class="shortcut-icon">🏸</span>
        </div>
        <span class="shortcut-pill-badge">ACTIVE</span>
      </div>
      <div class="shortcut-bottom">
        <h2 class="shortcut-title">Court Ledger</h2>
        <span class="shortcut-subtitle">羽球 AA 场费与账单平摊</span>
      </div>
    </div>

  </section>
</div>
