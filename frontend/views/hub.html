<!-- VIEW 1: MAIN TOOLBOX HUB (MAIN PAGE / 首页) -->

<div id="view-hub" class="app-view active">
  <!-- Raycast / Linear Style Hub Grid -->
  <section class="shortcuts-grid" id="tool-grid">

    <!-- Shortcut Card 0: Admin Console (Exclusive VIP Master Card, visible ONLY for Admin) -->
    <div id="hub-admin-card" class="shortcut-card shortcut-admin-exclusive hidden" data-target-view="admin">
      <div class="shortcut-top">
        <div class="shortcut-icon-circle admin-icon-glow">
          <span class="shortcut-icon">👑</span>
        </div>
        <div class="admin-badge-group">
          <span class="shortcut-pill-badge badge-master">⚡ SUPER ADMIN</span>
        </div>
      </div>
      <div class="shortcut-bottom">
        <div class="admin-title-row">
          <h2 class="shortcut-title admin-title-gradient">Admin Console</h2>
          <span class="admin-tag-pro">MASTER</span>
        </div>
        <span class="shortcut-subtitle">全系统唯一控制中心 · 权限治理与安全审计</span>
      </div>
    </div>

    <!-- Shortcut Card 1: Court Ledger (羽球 AA 算账器) -->
    <div class="shortcut-card shortcut-purple" data-target-view="courtledger">
      <div class="shortcut-top">
        <div class="shortcut-icon-circle">
          <span class="shortcut-icon">🏸</span>
        </div>
        <span class="shortcut-pill-badge">ACTIVE</span>
      </div>
      <div class="shortcut-bottom">
        <h2 class="shortcut-title">Court Ledger</h2>
        <span class="shortcut-subtitle">羽球 AA 场费与账单平摊</span>
      </div>
    </div>

    <!-- Shortcut Card 2: Advance Manager (垫付往来账管理) -->
    <div class="shortcut-card shortcut-emerald" data-target-view="advancemanager">
      <div class="shortcut-top">
        <div class="shortcut-icon-circle" style="background: rgba(16, 185, 129, 0.15); color: #10b981;">
          <span class="shortcut-icon">💸</span>
        </div>
        <span class="shortcut-pill-badge" style="background: rgba(16, 185, 129, 0.15); color: #10b981; border-color: rgba(16, 185, 129, 0.3);">ACTIVE</span>
      </div>
      <div class="shortcut-bottom">
        <h2 class="shortcut-title">Advance Manager</h2>
        <span class="shortcut-subtitle">垫付分摊 · 债务往来与结算</span>
      </div>
    </div>

  </section>
</div>
