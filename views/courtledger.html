<!-- =================================================================== -->
<!-- VIEW 2: COURT LEDGER (SUBPAGE 1 - 羽球 AA 算账器) -->
<!-- =================================================================== -->
<div id="view-courtledger" class="app-view hidden">
  <div class="calculator-card">

    <!-- Fixed Section: 每人收费 Display (Large Stock Ticker Style) -->
    <section class="ticker-section">
      <div class="ticker-label">每人收费</div>
      <div class="ticker-price-container">
        <span class="ticker-currency currency-unit">RM</span>
        <span id="player-fee-display" class="ticker-price">0.00</span>
      </div>
    </section>

    <!-- Swipe Viewport (Calculators on Slide 1, QR Code on Slide 2) -->
    <div class="swipe-viewport">
      <div class="swipe-track" id="swipe-track">

        <!-- Slide 1: Calculator page -->
        <div class="swipe-slide" id="slide-calc">
          <!-- Input Fields Section -->
          <section class="inputs-section">

            <!-- 场地选择 & 场地费计算参数 -->
            <div class="court-fee-config-box">
              <!-- 第一页第一项：场地选择 -->
              <div class="input-group venue-group">
                <div class="label-row-between">
                  <label for="venue-select">选择场地</label>
                  <span id="venue-rate-badge" class="venue-rate-badge">加载中...</span>
                </div>
                <div class="input-wrapper select-wrapper">
                  <select id="venue-select">
                    <!-- 动态由 venues.csv 加载 -->
                  </select>
                  <span class="select-chevron">▼</span>
                </div>
              </div>

              <div class="input-row-2col">
                <!-- 开始时间 Dropdown -->
                <div class="input-group">
                  <label for="start-time-select">开始时间</label>
                  <div class="input-wrapper select-wrapper">
                    <select id="start-time-select">
                      <option value="0">12:00 AM</option>
                      <option value="1">1:00 AM</option>
                      <option value="2">2:00 AM</option>
                      <option value="3">3:00 AM</option>
                      <option value="4">4:00 AM</option>
                      <option value="5">5:00 AM</option>
                      <option value="6">6:00 AM</option>
                      <option value="7">7:00 AM</option>
                      <option value="8">8:00 AM</option>
                      <option value="9">9:00 AM</option>
                      <option value="10">10:00 AM</option>
                      <option value="11">11:00 AM</option>
                      <option value="12">12:00 PM</option>
                      <option value="13">1:00 PM</option>
                      <option value="14">2:00 PM</option>
                      <option value="15">3:00 PM</option>
                      <option value="16" selected>4:00 PM</option>
                      <option value="17">5:00 PM</option>
                      <option value="18">6:00 PM</option>
                      <option value="19">7:00 PM</option>
                      <option value="20">8:00 PM</option>
                      <option value="21">9:00 PM</option>
                      <option value="22">10:00 PM</option>
                      <option value="23">11:00 PM</option>
                    </select>
                    <span class="select-chevron">▼</span>
                  </div>
                </div>

                <!-- 时长及滑块开关 -->
                <div class="input-group">
                  <label>时长 (点击选择)</label>
                  <div id="duration-trigger" class="picker-trigger duration-trigger-box">
                    <span id="duration-display" class="picker-value">2 小时</span>
                    <span class="picker-chevron">▼</span>
                  </div>
                </div>
              </div>

              <!-- Expanding Slider Panel (点击后滑动选择) -->
              <div id="duration-slider-panel" class="slider-panel collapsed">
                <div class="slider-header">
                  <span>滑动调整时长</span>
                  <span id="slider-val-bubble">2 小时</span>
                </div>
                <div class="slider-wrapper">
                  <span class="slider-boundary-label">1h</span>
                  <input type="range" id="duration-slider" min="1" max="4" value="2" step="1">
                  <span class="slider-boundary-label">4h</span>
                </div>
                <div id="time-range-display" class="time-range-banner">4:00 PM - 6:00 PM</div>
              </div>

              <!-- Court Count Radio Segmented Control -->
              <div class="input-group">
                <label>场地数量 (可点击或滑动)</label>
                <div class="segmented-control" id="court-segmented-control">
                  <input type="radio" name="court-count" id="court-1" value="1">
                  <label for="court-1">1 片</label>

                  <input type="radio" name="court-count" id="court-2" value="2">
                  <label for="court-2">2 片</label>

                  <input type="radio" name="court-count" id="court-3" value="3">
                  <label for="court-3">3 片</label>

                  <input type="radio" name="court-count" id="court-4" value="4">
                  <label for="court-4">4 片</label>

                  <div class="segmented-slider-thumb"></div>
                </div>
              </div>

              <!-- Calculated Court Fee Display -->
              <div class="input-group court-fee-display-wrapper">
                <label>场地费 (自动计算)</label>
                <div class="input-wrapper read-only-input">
                  <span class="input-prefix currency-unit">RM</span>
                  <input type="text" id="court-fee" value="0.00" readonly tabindex="-1">
                  <span id="court-fee-breakdown" class="input-suffix-tag">未选择场地</span>
                </div>
              </div>
            </div>

            <!-- Section 2: 人数与 Host 数量选择 -->
            <div class="input-row-2col">
              <div class="input-group">
                <label>参与总人数 (含Host)</label>
                <div id="players-picker" class="picker-trigger">
                  <span id="players-display" class="picker-value">6</span>
                  <span class="picker-suffix currency-unit">人</span>
                  <span class="picker-chevron">▼</span>
                </div>
                <input type="hidden" id="total-players" value="6">
              </div>

              <div class="input-group">
                <label>Host 数量</label>
                <div class="host-selector-segmented">
                  <button type="button" class="host-opt-btn active" data-host="0">0 Host</button>
                  <button type="button" class="host-opt-btn" data-host="1">1 Host</button>
                  <button type="button" class="host-opt-btn" data-host="2">2 Host</button>
                </div>
                <input type="hidden" id="host-count" value="0">
              </div>
            </div>

            <!-- Section 3: 用球数量 (真实用球) / 羽毛球价格 -->
            <div class="input-row-2col">
              <div class="input-group">
                <label>用球数量 (真实用球)</label>
                <div id="shuttles-picker" class="picker-trigger">
                  <span id="shuttles-display" class="picker-value">3</span>
                  <span class="picker-suffix currency-unit">个</span>
                  <span class="picker-chevron">▼</span>
                </div>
                <input type="hidden" id="shuttles-used" value="3">
              </div>
              <div class="input-group">
                <label for="shuttle-price">羽毛球价格 (桶)</label>
                <div class="input-wrapper">
                  <span class="input-prefix currency-unit">RM</span>
                  <input type="number" id="shuttle-price" value="123.00" min="0" step="0.01" placeholder="0.00"
                    inputmode="decimal">
                </div>
              </div>
            </div>

            <!-- Section 4: 附加加球 & 状态指示标签 -->
            <div class="input-group full-width-group">
              <div class="label-row-between">
                <label>附加加球 (用于盈利或覆盖Host)</label>
                <span id="shuttle-info-tag" class="info-pill-tag">建议加 2 个球覆盖 Host</span>
              </div>
              <div class="stepper-wrapper">
                <button type="button" id="add-shuttles-minus" class="stepper-btn"
                  aria-label="减少附加球">&minus;</button>
                <div class="stepper-value-group">
                  <span id="add-shuttles-display" class="stepper-value">0 个</span>
                  <span id="profit-shuttles-tag" class="profit-subtag">额外盈利: 0 个</span>
                </div>
                <button type="button" id="add-shuttles-plus" class="stepper-btn"
                  aria-label="增加附加球">&plus;</button>
              </div>
              <input type="hidden" id="additional-shuttles" value="0">
            </div>

          </section>

          <!-- Output Displays Section -->
          <section class="outputs-section">

            <!-- 用球统计 (真实用球, Cover用球, 盈利用球, 被计算总用球) -->
            <div class="shuttle-summary-card">
              <div class="shuttle-summary-title">🏸 用球统计明细</div>
              <div class="shuttle-summary-grid">
                <div class="shuttle-summary-item">
                  <span class="item-label">真实用球</span>
                  <span id="sum-actual-shuttles" class="item-val">0 个</span>
                </div>
                <div class="shuttle-summary-item">
                  <span class="item-label">Cover用球</span>
                  <span id="sum-cover-shuttles" class="item-val tag-blue">0 个</span>
                </div>
                <div class="shuttle-summary-item">
                  <span class="item-label">盈利用球</span>
                  <span id="sum-profit-shuttles" class="item-val tag-green">0 个</span>
                </div>
                <div class="shuttle-summary-item">
                  <span class="item-label">被计算总用球</span>
                  <span id="sum-billed-shuttles" class="item-val tag-accent">0 个</span>
                </div>
              </div>
            </div>

            <!-- Row 6: 总成本 -->
            <div class="summary-row">
              <span class="summary-label">真实总成本</span>
              <div class="summary-value-wrapper">
                <span class="summary-currency currency-unit">RM</span>
                <span id="total-cost-display" class="summary-value">0.00</span>
              </div>
            </div>

            <!-- Row 7: 总收款 -->
            <div class="summary-row">
              <span class="summary-label">总收款 (付费玩家)</span>
              <div class="summary-value-wrapper">
                <span class="summary-currency currency-unit">RM</span>
                <span id="total-revenue-display" class="summary-value">0.00</span>
              </div>
            </div>

            <!-- Row 8: 净利润 -->
            <div id="profit-row" class="summary-row profit-highlight">
              <span class="summary-label">净利润 (盈利)</span>
              <div class="summary-value-wrapper">
                <span class="summary-currency currency-unit">RM</span>
                <span id="net-profit-display" class="summary-value">0.00</span>
              </div>
            </div>

          </section>

          <!-- Copy Bill Button -->
          <button id="copy-bill-btn" class="copy-bill-btn">
            <span class="btn-icon">📋</span>
            <span class="btn-text">复制账单明细</span>
          </button>

          <!-- Warning panel for invalid configurations -->
          <div id="error-banner" class="error-banner hidden">
            <span class="error-icon">⚠️</span>
            <span class="error-msg">参与人数必须大于 Host人数！</span>
          </div>

        </div>

        <!-- Slide 2: QR Code page -->
        <div class="swipe-slide" id="slide-qr">
          <div class="qr-container">
            <div class="qr-title">DUITNOW QR</div>
            <div class="qr-image-wrapper">
              <img src="assets/duitnow-qr.png" alt="收款二维码" class="qr-image">
            </div>
            <div class="qr-tip">DUITNOW QR</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Page indicator dots -->
    <div class="page-indicators">
      <span class="indicator-dot active" data-page="0"></span>
      <span class="indicator-dot" data-page="1"></span>
    </div>

  </div>
</div>
